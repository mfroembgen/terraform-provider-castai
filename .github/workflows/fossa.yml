name: FOSSA

on:
  push:
    branches:
      - master

jobs:
  fossa-scan:
    if: github.repository == 'castai/terraform-provider-castai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
